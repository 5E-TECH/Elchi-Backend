  # lekin faqat shu servis uni o'qiydi va tekshiradi — bo'sh bo'lsa servis AI
  # o'chiq holda normal ko'tariladi.
  # ⚠️ RMQ navbat TTL'i (rmq.service.ts) bu servis uchun ham O'ZGARTIRILMAYDI —
  # uzoq AI chaqiruvi AI_RPC_TIMEOUT_MS bilan boshqariladi, TTL bilan emas.
  ai-service:
    <<: *svc-limits
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    env_file: .env.production
    # Pool budget: ai-service faqat usage log + kunlik spend counter yozadi (kam
    # trafik), shuning uchun default 10 emas, 5 — max_connections=200 ichida
    # order(20) + finance(20) + qolganlar(~10) bilan birga bosh joy qoladi.
    environment:
      DB_POOL_MAX: '5'
    depends_on:
      rabbitmq:
