# Bounded json-file logging so container logs can't fill the host disk (Audit
# observability/devops P2: Docker's default json-file driver is unbounded).
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Konteyner qotirish (qUEE0Bgd). Ilova va ops image'lari root emas (USER node),
# Linux capability kerak emas (port > 1024, fayl egasi o'zgarmaydi), setuid
# orqali imtiyoz ko'tarish yopiq. x-svc-limits / x-hot-svc-limits orqali hamma
# app servisiga tushadi. postgres / rabbitmq / minio bu yerda EMAS: entrypoint
# root'da chown qilib o'z foydalanuvchisiga tushadi, cap_drop: ALL ularni
# buzadi, ta'rifi o'zgarsa esa deploy postgres/minio ni qayta yaratadi.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Resource ceilings (Audit devops P2: no limits → one leaking/forking service
# could starve the host and take every other service down with it). These are
# deliberately GENEROUS safety ceilings — sized well above steady-state so they
# never bite healthy operation; they only bound a runaway memory leak or fork
# storm. `pids_limit` is a cheap fork-bomb guard with no downside. CPU is left
# unthrottled so latency-sensitive money paths are never CPU-starved. Tune
# mem_limit DOWN only with real production memory profiling — too tight causes
# OOM-kill restart loops.
x-svc-limits: &svc-limits
  <<: *hardening
  mem_limit: 1g
  mem_reservation: 256m
  pids_limit: 512

# Hot paths (gateway + order + finance): more headroom for larger DB pools and
# bigger in-flight result sets.
x-hot-svc-limits: &hot-svc-limits
  <<: *hardening
  mem_limit: 1536m
  mem_reservation: 512m
  pids_limit: 512

# Backup sidecar'lari root bo'lib QOLADI (qUEE0Bgd): ./backups/daily root'niki
# (0700), ./backups/pre-deploy dump'lari esa host'dagi deploy foydalanuvchisiniki
# (umask 077 = 0600) — postgres/rclone foydalanuvchisi ularga yetmaydi, root ham
# faqat DAC capability bilan yetadi. Boshqa hamma capability olib tashlangan.
x-backup-hardening: &backup-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - DAC_OVERRIDE
    - DAC_READ_SEARCH

# Ops sidecar'lari (qUEE0Bgd): migration-runner, db-reconcile, activity-log-prune
# — bitta Dockerfile.ops dan (kod + dev deps image ichida, USER node). `npm ci`
# ishga tushishda emas, repo bind-mount yo'q. Kod image'ga build paytida kirgani
# uchun deploy.yml ularni o'zi yangilaydi: migration-runner `up --build`, qolgan
# ikkisi faqat ishlayotgan bo'lsa (`OPS_SIDECARS`).
x-ops: &ops
  <<: *hardening
  build:
    context: .
    dockerfile: Dockerfile.ops

# Cloudflare Tunnel connector (ZfI9nERJ). Two identical replicas of the SAME
# tunnel (TUNNEL_TOKEN): Cloudflare spreads requests over every connected
# replica, so one replica restarting / being recreated is not an outage.
# * Image PINNED to the exact build that ran in prod since 2026-10-25
#   (2026.9.1, multi-arch digest) — never `:latest`: deploy.yml used to `pull`
#   it every time and a new upstream build recreated the only connector mid-deploy.
# * deploy.yml never recreates these on a routine deploy (`--no-recreate`); only
#   when this image line changes it rolls them ONE AT A TIME (cloudflared-2
#   first, waits for "Registered tunnel connection", then cloudflared).
#   A TUNNEL_TOKEN change therefore needs a manual rolling recreate
#   (docs/ops/secret-rotation.md).
# * No depends_on api-gateway: the tunnel stays up while the gateway is swapped.
# * stop_grace_period > cloudflared's own 30 s --grace-period: in-flight
#   requests finish before Docker kills it. ~40 MiB RSS each — 256m is ample.
# * qUEE0Bgd: image o'zi root emas (nonroot). Hardening konteyner keyingi safar
#   rolling qayta yaratilganda kuchga kiradi — deploy buning uchun tegmaydi.
x-cloudflared: &cloudflared
  <<: *hardening
  image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
  command: tunnel --no-autoupdate run
  env_file: .env.production
  mem_limit: 256m
  mem_reservation: 32m
  pids_limit: 128
  stop_grace_period: 35s
  logging: *json-logging
  restart: unless-stopped

services:
  rabbitmq:
    # qUEE0Bgd: tag + digest bilan qotirilgan — `3-management` tag'i bilan aynan bir
    # xil image (3.13.7; digest 2026-10-30 da Docker Hub'da solishtirilgan).
    # ⚠️ deploy.yml bu konteynerni `--no-recreate` bilan ko'taradi va shunday
    # qolishi SHART: `hostname:` yo'q, node nomi = konteyner id (rabbit@<id>).
    # Qayta yaratilsa volume'da YANGI bo'sh mnesia ochiladi: foydalanuvchilar
    # (rotatsiyadagi `elchi`, docs/ops/secret-rotation.md) yo'qoladi, guest qaytadi
    # va hamma servis brokerga ulana olmaydi. Image qatorini o'zgartirish
    # shuning uchun o'z-o'zidan kuchga kirmaydi — qo'lda, rejali ish.
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: elchi-rabbitmq
    restart: unless-stopped
    # Faqat localhost'ga bog'lanadi — internetga ochiq emas.
    # Management UI (15672) ga SSH tunnel orqali kiriladi.
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    # qUEE0Bgd: `pull_policy: missing` — serverda bor image yangilanmaydi. Ilgari
    # deploy'dagi `pull` minio xatosida to'xtab (fail-fast) postgres'ga yetmasdi;
    # minio o'tkazib yuborilgach u yangi 15.x ni tortib, keyingi `up -d` da prod
    # DB'ni kutilmaganda qayta yaratardi. pull_policy config hash'ga kirmaydi:
    # konteyner qayta yaratilmaydi. Minor yangilash — alohida, rejali ish.
    image: postgres:15
    pull_policy: missing
    container_name: elchi-postgres
    restart: unless-stopped
    # Scale NOW-2: raise max_connections from the image default (100) to 200.
    # 11 DB-backed services x DB_POOL_MAX (default 10) = ~110 demanded, which
    # oversubscribed the old ~97 usable ceiling and made 'too many clients'
    # latent. 200 ends the oversubscription with headroom for migrations/admin
    # and the higher per-service pools below. (A PgBouncer transaction pooler is
    # the next step before pushing this much higher on one untuned box.)
    command: ['-c', 'max_connections=200']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Faqat localhost'ga bog'lanadi — internetga ochiq emas.
    # Serverga SSH tunnel orqali ulanib DB'ga kirish mumkin.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # qUEE0Bgd: `minio/minio` Docker Hub'dan yo'qolgan (2026-10-30 da repo 404), image
    # serverda faqat lokal nusxa (staging'da `docker load`, docs/ops/staging.md).
    # Tag + digest'ga o'tkazib bo'lmaydi: serverdagi digest tekshirilmagan, mos
    # kelmasa `up` pull qilishga urinadi va deploy yiqiladi. Shuning uchun lokal
    # image qotiriladi: `pull_policy: never` — `latest` registry'dan hech qachon
    # olinmaydi (o'sha nom bilan chiqqan begona image ham), deploy'dagi `pull` uni
    # o'tkazib yuboradi, konteyner qayta yaratilmaydi. Dev mashinadagi nusxa:
    # RELEASE.2025-09-07T16-13-09Z, sha256:14cea493d9a3… (serverdagisi bilan
    # solishtirilmagan).
    image: minio/minio:latest
    pull_policy: never
    container_name: elchi-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # Faqat localhost'ga bog'lanadi — internetga ochiq emas.
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  migration-runner:
    <<: *ops
    container_name: elchi-migration-runner
    env_file: .env.production
    command: ['npm', 'run', 'db:prepare']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Daily PostgreSQL backups (Elchi Pochta "Avtomatik backup tizimi"; Audit P0:
  # single Postgres SPOF with no scheduled backup). Har kuni 05:00 Asia/Tashkent
  # a verified pg_dump lands in the host bind-mount ./backups/daily and the
  # newest 7 are kept (scripts/backup-cron.sh). Same postgres:15 image so
  # pg_dump version-matches the server; connection comes from .env.production
  # (POSTGRES_URI). deploy.yml starts/updates this service on every deploy.
  # Overrides (BACKUP_DAILY_AT, BACKUP_TZ, BACKUP_DAILY_KEEP) and the optional
  # off-box BACKUP_S3_TARGET go in .env.production — NOT in `environment:`
  # below, which would silently win over the env_file. Pre-deploy dumps are
  # separate: ./backups/pre-deploy (scripts/pre-deploy-backup.sh).
  # Runbook: docs/ops/db-backups.md.
  db-backup:
    <<: *backup-hardening
    image: postgres:15
    container_name: elchi-db-backup
    env_file: .env.production
    environment:
      BACKUP_DIR: /backups/daily
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint: ['bash', '/scripts/backup-cron.sh']
    # `docker ps` shows (unhealthy) once the newest daily dump is > 26h old —
    # i.e. a day's backup was missed or keeps failing.
    healthcheck:
      test: ['CMD', 'bash', '/scripts/backup-cron.sh', '--check']
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 15m
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    restart: unless-stopped

  # Off-site copies of the DB dumps -> Cloudflare R2 (Contabo VPS outages: the
  # dumps above live on the same box as the DB). Every hour it uploads the new
  # ./backups/{daily,pre-deploy,pre-migration}/*.sql.gz (never overwrites an
  # object), verifies them (size + MD5) and deletes R2 copies older than
  # OFFSITE_RETENTION_DAYS (30) — scripts/backup-offsite.sh. The backups dir is
  # mounted READ-ONLY. rclone is configured only from env: the script maps
  # R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET from
  # .env.production to RCLONE_CONFIG_R2_* — no rclone.conf, and no keys in this
  # file (nor OFFSITE_* defaults in `environment:`, which would mask the
  # env_file). Without the R2 keys it only logs «R2 sozlanmagan» and stays up
  # (healthy). deploy.yml starts it but never waits for or gates on it.
  # Runbook: docs/ops/db-backups.md.
  backup-offsite:
    <<: *backup-hardening
    image: rclone/rclone:1.68.2
    container_name: elchi-backup-offsite
    env_file: .env.production
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups:ro
    entrypoint: ['sh', '/scripts/backup-offsite.sh']
    # (unhealthy) once configured and the last successful sync is > 26h old,
    # or the first sync failed. Disabled (no R2 keys) counts as healthy.
    healthcheck:
      test: ['CMD', 'sh', '/scripts/backup-offsite.sh', '--check']
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 15m
    mem_limit: 256m
    mem_reservation: 32m
    pids_limit: 64
    logging: *json-logging
    restart: unless-stopped

  # Scheduled cashbox reconciliation (Audit money P1: the invariant check existed
  # but was never scheduled). Runs db:reconcile (--reconcile-strict) on a loop;
  # any cashbox I1/I2 drift or settlement mismatch is reported to Sentry. Reuses
  # the migration-runner image (Dockerfile.ops: dev deps for ts-node).
  db-reconcile:
    <<: *ops
    container_name: elchi-db-reconcile
    env_file: .env.production
    environment:
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-3600}
    command: ['sh', 'scripts/reconcile-cron.sh']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    restart: unless-stopped

  # Scheduled activity-log retention prune (audit devops: activity_logs grew
  # without bound). Runs db:prune-activity-logs on a daily loop. i6Nyedea:
  # row deletion follows the per-verb policy (ACTIVITY_LOG_RETENTION_AUTH_DAYS /
  # ACTIVITY_LOG_RETENTION_DEFAULT_DAYS) and happens ONLY when
  # ACTIVITY_LOG_PRUNE_ENABLED=true in .env.production — otherwise dry-run
  # (counts only). ip/device metadata strip (f2Ud5tju) keeps running.
  # Archive (i6Nyedea, default ON via ACTIVITY_LOG_PRUNE_ARCHIVE): pruned rows
  # are MOVED to each schema's activity_logs_archive (migration 1716000000101),
  # never just deleted; a schema without that table is skipped (exit 1).
  activity-log-prune:
    <<: [*svc-limits, *ops]
    container_name: elchi-activity-log-prune
    env_file: .env.production
    environment:
      ACTIVITY_LOG_PRUNE_INTERVAL_SECONDS: ${ACTIVITY_LOG_PRUNE_INTERVAL_SECONDS:-86400}
    command: ['sh', 'scripts/prune-activity-logs-cron.sh']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    restart: unless-stopped

  api-gateway:
    <<: *hot-svc-limits
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    env_file: .env.production
    # Host portga chiqarilmaydi — tashqaridan kirish faqat Cloudflare Tunnel
    # orqali. cloudflared bu konteynerga ichki docker tarmog'i orqali ulanadi.
    depends_on:
      rabbitmq:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    logging: *json-logging
    restart: unless-stopped
    # Real liveness: hit the gateway's own @Public /health (port 3004 — the
    # internal contract cloudflared routes to). Uses the bundled node binary so
    # no curl/wget is required in the image. start_period covers Nest bootstrap.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # TUNNEL_TOKEN .env.production'dan o'qiladi. Public Hostname sozlamasi
  # (api.elchipochta.uz -> http://api-gateway:3004) Cloudflare Zero Trust
  # dashboard'ida belgilanadi. Ikkala replika — x-cloudflared (yuqorida).
  cloudflared:
    <<: *cloudflared
    container_name: elchi-cloudflared

  cloudflared-2:
    <<: *cloudflared
    container_name: elchi-cloudflared-2

  identity-service:
    <<: *svc-limits
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    env_file: .env.production
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    logging: *json-logging
    restart: unless-stopped
    # Liveness: hit the worker's own /health (registerLiveness) so Docker
    # restarts a wedged container. Uses the bundled node binary.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3011/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  order-service:
