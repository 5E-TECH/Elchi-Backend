    logging: *json-logging
    restart: unless-stopped

  finance-service:
    <<: *hot-svc-limits
    build:
      context: .
      dockerfile: apps/finance-service/Dockerfile
    env_file: .env.production
    # Scale NOW-2: hot money path — larger pool (default 10) for the cashbox
    # update_balance consumers + finance's own settlement-advance outbox publisher.
    environment:
      DB_POOL_MAX: '20'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    logging: *json-logging
    restart: unless-stopped

  notification-service:
