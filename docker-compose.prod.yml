# Bounded json-file logging so container logs can't fill the host disk (Audit
# observability/devops P2: Docker's default json-file driver is unbounded).
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Resource ceilings (Audit devops P2: no limits → one leaking/forking service
# could starve the host and take every other service down with it). These are
# deliberately GENEROUS safety ceilings — sized well above steady-state so they
# never bite healthy operation; they only bound a runaway memory leak or fork
# storm. `pids_limit` is a cheap fork-bomb guard with no downside. CPU is left
# unthrottled so latency-sensitive money paths are never CPU-starved. Tune
# mem_limit DOWN only with real production memory profiling — too tight causes
# OOM-kill restart loops.
x-svc-limits: &svc-limits
  mem_limit: 1g
  mem_reservation: 256m
  pids_limit: 512

# Hot paths (gateway + order + finance): more headroom for larger DB pools and
# bigger in-flight result sets.
x-hot-svc-limits: &hot-svc-limits
  mem_limit: 1536m
  mem_reservation: 512m
  pids_limit: 512

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: elchi-rabbitmq
    # Faqat localhost'ga bog'lanadi — internetga ochiq emas.
    # Management UI (15672) ga SSH tunnel orqali kiriladi.
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15
    container_name: elchi-postgres
    # Scale NOW-2: raise max_connections from the image default (100) to 200.
    # 11 DB-backed services x DB_POOL_MAX (default 10) = ~110 demanded, which
    # oversubscribed the old ~97 usable ceiling and made 'too many clients'
    # latent. 200 ends the oversubscription with headroom for migrations/admin
    # and the higher per-service pools below. (A PgBouncer transaction pooler is
    # the next step before pushing this much higher on one untuned box.)
    command: ['-c', 'max_connections=200']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Faqat localhost'ga bog'lanadi — internetga ochiq emas.
    # Serverga SSH tunnel orqali ulanib DB'ga kirish mumkin.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: elchi-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # Faqat localhost'ga bog'lanadi — internetga ochiq emas.
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  migration-runner:
    image: node:20-alpine
    container_name: elchi-migration-runner
    working_dir: /app
    env_file: .env.production
    volumes:
      - ./:/app
    command: sh -c "npm ci --include=dev && npm run db:prepare"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Automated, rotated, off-box-capable PostgreSQL backups (Audit P0: single
  # Postgres SPOF with no scheduled backup). Uses the same postgres:15 image so
  # pg_dump version-matches the server; connection comes from .env.production
  # (POSTGRES_URI or POSTGRES_HOST/USER/PASSWORD/DB). Dumps land in the host
  # bind-mount ./backups; set BACKUP_S3_TARGET in .env.production to also push
  # each dump off the box (the part that actually survives disk/volume loss).
  db-backup:
    image: postgres:15
    container_name: elchi-db-backup
    env_file: .env.production
    environment:
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-28}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint: ['bash', '/scripts/backup-cron.sh']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    restart: unless-stopped

  # Scheduled cashbox reconciliation (Audit money P1: the invariant check existed
  # but was never scheduled). Runs db:reconcile (--reconcile-strict) on a loop;
  # any cashbox I1/I2 drift or settlement mismatch is reported to Sentry. Reuses
  # the migration-runner pattern (repo mount + dev deps for ts-node).
  db-reconcile:
    image: node:20-alpine
    container_name: elchi-db-reconcile
    working_dir: /app
    env_file: .env.production
    environment:
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-3600}
    volumes:
      - ./:/app
    command: sh -c "npm ci --include=dev && sh scripts/reconcile-cron.sh"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
    restart: unless-stopped

  api-gateway:
    <<: *hot-svc-limits
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    env_file: .env.production
    # Host portga chiqarilmaydi — tashqaridan kirish faqat Cloudflare Tunnel
    # orqali. cloudflared bu konteynerga ichki docker tarmog'i orqali ulanadi.
    depends_on:
      rabbitmq:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    logging: *json-logging
    restart: unless-stopped
    # Real liveness: hit the gateway's own @Public /health (port 3004 — the
    # internal contract cloudflared routes to). Uses the bundled node binary so
    # no curl/wget is required in the image. start_period covers Nest bootstrap.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  cloudflared:
    <<: *svc-limits
    image: cloudflare/cloudflared:latest
    container_name: elchi-cloudflared
    # TUNNEL_TOKEN .env.production'dan o'qiladi. Public Hostname sozlamasi
    # (api.elchipochta.uz -> http://api-gateway:3004) Cloudflare Zero Trust
    # dashboard'ida belgilanadi.
    command: tunnel --no-autoupdate run
    env_file: .env.production
    depends_on:
      - api-gateway
    logging: *json-logging
    restart: unless-stopped

  identity-service:
    <<: *svc-limits
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    env_file: .env.production
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    logging: *json-logging
    restart: unless-stopped

  order-service:
    <<: *hot-svc-limits
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    env_file: .env.production
    # Scale NOW-2: hot path — larger pool than the default 10 so the concurrent
    # outbox publisher (NOW-4) and order.sell traffic have connection headroom.
    # Budgeted with finance(20) + others(~10) to stay well under max_connections=200.
    environment:
      DB_POOL_MAX: '20'
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    logging: *json-logging
    restart: unless-stopped

  catalog-service:
    <<: *svc-limits
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    env_file: .env.production
    depends_on:
      rabbitmq:
