# Gitleaks config for Elchi-Backend secret scanning (Audit P0/P1: real secrets
# were committed; this gate blocks NEW ones). CI (ci.yml `secret-scan`) runs
# `gitleaks detect --no-git` over the working tree AND (bVuDHPFR) a git-history
# scan of the PR range / pushed commits; security-weekly.yml scans the full
# history. Already-known historical findings are baselined by exact fingerprint
# in `.gitleaksignore` (no blanket path/regex ignore for them).
title = "Elchi gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Example/template placeholders and documentation are not real secrets"
paths = [
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
  '''docs/.*''',
  # Unit/e2e test fixtures use throwaway fake credentials (e.g. 'valid-key-123'
  # in partner-api-key.guard.spec.ts) — not live secrets, so they must not fail
  # the secret-scan gate. Real credentials belong in config, never in tests.
  '''.*\.spec\.ts$''',
  '''.*\.spec\.tsx$''',
  '''.*\.test\.ts$''',
  '''.*\.test\.tsx$''',
]
# The __REPLACE_WITH...__ template markers and known example tokens are not
# live credentials — only real values in real config files should fail CI.
regexes = [
  '''__REPLACE_WITH[A-Za-z0-9_]*__''',
  '''guest:guest''',
]
