# (bVuDHPFR) Bog'liqliklarni avtomatik yangilash — haftalik, guruhlangan.
#
# PR'lar standart branch'ga (dev) ochiladi va oddiy PR kabi CI'dan o'tadi;
# deploy faqat dev → main relizida. minor/patch yangilanishlar bitta-ikkita
# guruh PR'iga yig'iladi (har paket uchun alohida PR oqimi bo'lmasin); major
# yangilanishlar alohida PR — ular qo'lda ko'rib chiqiladi.
# Zaiflik (security) PR'lari repo sozlamasida yoqiladi:
# Settings → Code security → Dependabot security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # TypeScript major (6.x, 7.x) — avtomatik PR ochilmaydi, rejali migratsiya
    # bilan qo'lda o'tiladi. Sabab (#615, 2026-11-12): TS 6 da tsconfig
    # sukutlari o'zgargan (baseUrl xato, rootDir, strict: true, types: []).
    # CI'dagi build/test buziladi, prod'da esa ts-node bilan type-check
    # qiladigan ops sidecar'lar (migration-runner db:prepare, db-reconcile,
    # activity-log-prune) yiqiladi — CI ularni tekshirmaydi. Migratsiyada
    # shu uch skriptni scratch DB'da ishga tushirib tekshirish majburiy.
    # Qoida migratsiya PR'i bilan olib tashlanadi.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'
