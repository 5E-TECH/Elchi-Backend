name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint gating — caller may not have run it locally
      - name: Lint
        run: npx eslint --max-warnings 0 'apps/**/*.ts' 'libs/**/*.ts'
        # eslint config may not exist in all branches; soft-fail until adopted
        continue-on-error: true

      # Type-check every service in the monorepo. Each call uses its own
      # tsconfig.app.json so service-specific path mappings are honoured.
      - name: TypeScript check (all services)
        run: |
          set -e
          for app in apps/*/; do
            tsconfig="${app}tsconfig.app.json"
            if [ -f "$tsconfig" ]; then
              echo "=== typecheck $(basename "$app") ==="
              npx tsc --noEmit -p "$tsconfig"
            fi
          done

      # New specs added in the observability/idempotency hardening sprint
      # MUST always pass. Legacy specs (predate the sprint) still have
      # drift — track them under the "legacy spec repair" backlog rather
      # than gating the whole CI on them.
      - name: Critical-path unit tests (must pass)
        run: |
          npx jest \
            apps/finance-service/src/finance-service.service.spec.ts \
            apps/identity-service/src/auth/auth.service.spec.ts \
            apps/order-service/src/order-service.bulk-batch.spec.ts \
            --runInBand
        env:
          NODE_ENV: test

      # Elchi Partner API (marketplace integration: auth guard, partner CRUD,
      # key rotation, market provisioning, geo passthrough) — must always pass.
      - name: Partner API tests (must pass)
        run: npx jest partner --runInBand
        env:
          NODE_ENV: test

      # BLOCKING: the full suite is green (the 3 legacy red specs were repaired),
      # so it now gates merges — this is what puts the settlement / dedup-epoch /
      # return-flow money-invariant specs (previously only in the non-blocking
      # run) behind the merge gate. (Audit testing P1.)
      - name: Full unit test suite (must pass)
        run: npm run test:ci
        env:
          NODE_ENV: test

      # Build each service to catch import / decorator metadata regressions
      # that bare typecheck misses. Gateway + integration-service (Partner API
      # lives here) are smoke-built to keep CI fast; full build is in deploy.yml.
      - name: Build smoke (gateway + integration)
        run: |
          npx nest build api-gateway
          npx nest build integration-service

  # Secret-scanning gate (Audit P0/P1: live secrets were committed to history).
  # Scans the working tree so a PR that adds a real credential to a tracked file
  # fails CI. History remediation (git filter-repo + rotation) is a separate,
  # one-time task documented in docs/audit/SECRET_ROTATION_RUNBOOK.md.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -e
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for committed secrets
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1

  coverage-summary:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --coverageReporters=text-summary
        continue-on-error: true
