name: CI

on:
  pull_request:
    branches: [main, dev, test]
  push:
    branches: [dev, test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint gating — caller may not have run it locally
      - name: Lint
        run: npx eslint --max-warnings 0 'apps/**/*.ts' 'libs/**/*.ts'
        # eslint config may not exist in all branches; soft-fail until adopted
        continue-on-error: true

      # Type-check every service in the monorepo. Each call uses its own
      # tsconfig.app.json so service-specific path mappings are honoured.
      - name: TypeScript check (all services)
        run: |
          set -e
          for app in apps/*/; do
            tsconfig="${app}tsconfig.app.json"
            if [ -f "$tsconfig" ]; then
              echo "=== typecheck $(basename "$app") ==="
              npx tsc --noEmit -p "$tsconfig"
            fi
          done

      # OpenAPI drift gate: the committed docs/frontend/openapi.json is the
      # frontend's contract. Regenerate it from the live gateway routes and fail
      # if it differs from what's committed — so a backend route change can't
      # silently drift the spec the frontend generates its client from.
      - name: OpenAPI spec is in sync
        run: |
          npm run openapi:generate
          git diff --exit-code -- docs/frontend/openapi.json \
            || { echo "::error::openapi.json is stale — run 'npm run openapi:generate' and commit the result."; exit 1; }

      # Staging (docs/ops/staging.md): the `deploy-staging` script in deploy.yml
      # is GENERATED from the production `deploy` script, and every service of
      # docker-compose.prod.yml must render on top of docker-compose.staging.yml
      # with ONLY .env.staging present (a service still on .env.production —
      # e.g. a new one without a staging entry — fails here, not on the server).
      # Every key of .env.example must also be in .env.staging.example: a key
      # (feature flag) missing there means the test server runs on its default
      # while production may not — «passed on staging» would prove nothing.
      - name: Staging deploy is in sync
        run: |
          node scripts/staging/sync-deploy-workflow.mjs --check
          env_keys() { grep -oE '^[A-Z][A-Z0-9_]*=' "$1" | tr -d = | sort -u; }
          missing="$(comm -23 <(env_keys .env.example) <(env_keys .env.staging.example))"
          if [ -n "$missing" ]; then
            echo "::error::.env.staging.example lacks keys from .env.example: $(echo $missing) — add them (same value as production; docs/ops/staging.md)."
            exit 1
          fi
          cp .env.staging.example .env.staging
          docker compose --env-file .env.staging -f docker-compose.prod.yml -f docker-compose.staging.yml config --quiet
          rm -f .env.staging

      # New specs added in the observability/idempotency hardening sprint
      # MUST always pass. Legacy specs (predate the sprint) still have
      # drift — track them under the "legacy spec repair" backlog rather
      # than gating the whole CI on them.
      - name: Critical-path unit tests (must pass)
        run: |
          npx jest \
            apps/finance-service/src/finance-service.service.spec.ts \
            apps/identity-service/src/auth/auth.service.spec.ts \
            apps/order-service/src/order-service.bulk-batch.spec.ts \
            --runInBand
        env:
          NODE_ENV: test

      # J3hEDtFN: AI buyurtma ekstraksiyasi eval'i — yozib olingan javoblar
      # bilan (replay), ANTHROPIC_API_KEY KERAK EMAS, tarmoqqa chiqmaydi.
      # Telefon / narx / tuman aniqligi ≥95% va baseline'dan past emas.
      - name: AI eval (replay, kalitsiz)
        run: npm run ai:eval -- --ci
        env:
          NODE_ENV: test

      # Elchi Partner API (marketplace integration: auth guard, partner CRUD,
      # key rotation, market provisioning, geo passthrough) — must always pass.
      - name: Partner API tests (must pass)
        run: npx jest partner --runInBand
        env:
          NODE_ENV: test

      # To'liq unit suite pastdagi alohida `unit-tests` job'ida (shard'langan).

      # (7s1bqOT6) Gateway HTTP e2e — HAQIQIY ApiGatewayModule, faqat RMQ
      # mijozlari mock (RabbitMQ/Postgres kerak emas): `GET /health` (liveness)
      # va `GET /health/readiness` (14 servis) marshrutlari to'qnashmasin.
      - name: Gateway e2e (must pass)
        run: npm run test:e2e -- --ci --runInBand
        env:
          NODE_ENV: test

      # Build each service to catch import / decorator metadata regressions
      # that bare typecheck misses. Gateway + integration-service (Partner API
      # lives here) are smoke-built to keep CI fast; full build is in deploy.yml.
      # ai-service is smoke-built too: it is the only app that wires ClaudeModule
      # (@anthropic-ai/sdk) at runtime, so a broken import there fails the PR
      # instead of the production deploy.
      - name: Build smoke (gateway + integration + ai)
        run: |
          npx nest build api-gateway
          npx nest build integration-service
          npx nest build ai-service

  # BLOCKING: the full suite is green (the 3 legacy red specs were repaired),
  # so it now gates merges — this is what puts the settlement / dedup-epoch /
  # return-flow money-invariant specs (previously only in the non-blocking
  # run) behind the merge gate. (Audit testing P1.)
  # 2026-10-26: suite `--runInBand` bilan ~11 daqiqaga yetdi va
  # lint-typecheck-test job'ining 15 daqiqalik timeout'idan oshib, dev push
  # run'lari testlar yashil bo'lsa ham "cancelled" bo'ldi. Endi ALOHIDA job,
  # 3 ta parallel runner'ga `--shard` bilan bo'linadi; har shard ichida
  # --runInBand saqlanadi (bajarilish semantikasi o'zgarmaydi). Suite yana
  # o'ssa — matrix'ga shard qo'shing, `job-total` o'zi moslashadi.
  unit-tests:
    name: unit-tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full unit test suite (must pass)
        run: npm run test:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          NODE_ENV: test

  # 2026-10-17: notification-service prodda Nest DI xatosi (aylanma import
  # → "can't resolve dependencies") bilan ko'tarilmadi — unit testlar DI
  # konteynerini qurmaydi. Har servis bundle'i DB/RMQ'siz qisqa ishga
  # tushiriladi; DI yoki config xatosi bo'lsa CI qizil.
  # ALOHIDA job: hamma servisni build qilish bir necha daqiqa oladi — yuqoridagi
  # job ichida 15 daqiqalik timeout'dan oshib, run "cancelled" bo'lardi.
  di-boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: DI boot smoke (all services)
        run: bash scripts/di-boot-smoke.sh

  # Postgres-gated bot specs (`*.pg.spec.ts`, BOT_PG_TEST_URI): atomik qaror
  # (1tnpaIqd), bir martalik ulash kodi, outbox/dedup va h.k. — real DB'da.
  # Boshqa *_PG_TEST_URI spec'lari bu yerda berilmagan, ular skip bo'ladi.
  # Baza nomi `elchi_bot_test` — bot-core/telegram-link spec'lari faqat shu
  # nomdagi lokal bazada ishlaydi (sxemani tozalaydi).
  bot-postgres-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: elchi_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bot Postgres specs
        run: npx jest --runInBand --ci --testPathPatterns '\.pg\.spec\.ts$'
        env:
          NODE_ENV: test
          BOT_PG_TEST_URI: postgres://postgres@127.0.0.1:5432/elchi_bot_test

  # (O9ATqZ27) Ombor real-Postgres spec'lari: parallel band (manfiy qoldiq /
  # ortiqcha band yo'q), idempotent kirim/qaytish, market IDOR, Markaziy ombor
  # zanjiri (VkKDSNNn), ro'yxat filtrlari; T8 maxsus belgilar (migratsiya 187,
  # FOR UPDATE, analitika). Ular `CATALOG_PG_TEST_URI` /
  # `ORDER_WAREHOUSE_PG_TEST_URI` siz skip bo'ladi — shuning uchun alohida job.
  # Spec'lar faqat lokal `/elchi_e_test` bazasini qabul qiladi va o'z per-pid
  # sxemalarini yaratadi; bot job'i bilan baza nomi to'qnashmaydi.
  warehouse-postgres-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: elchi_e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Warehouse Postgres specs
        run: >-
          npx jest --runInBand --ci
          apps/catalog-service/src/warehouse/warehouse.pg.spec.ts
          apps/order-service/src/warehouse/order-warehouse.pg.spec.ts
          apps/order-service/src/order-service.list-warehouse-filter.VkKDSNNn.pg.spec.ts
          apps/order-service/src/lifecycle/order-special-categories.T8.pg.spec.ts
        env:
          NODE_ENV: test
          CATALOG_PG_TEST_URI: postgres://postgres@127.0.0.1:5432/elchi_e_test
          ORDER_WAREHOUSE_PG_TEST_URI: postgres://postgres@127.0.0.1:5432/elchi_e_test
          # T8: spec o'z vaqtinchalik bazasini yaratadi (migratsiya 187 `order_schema`
          # ga yozadi) va oxirida o'chiradi — elchi_e_test faqat ulanish uchun.
          ORDER_T8_PG_TEST_URI: postgres://postgres@127.0.0.1:5432/elchi_e_test

  # Secret-scanning gate (Audit P0/P1: live secrets were committed to history).
  # Scans the working tree so a PR that adds a real credential to a tracked file
  # fails CI. History remediation (git filter-repo + rotation) is a separate,
  # one-time task documented in docs/audit/SECRET_ROTATION_RUNBOOK.md.
  # (bVuDHPFR) Ishchi daraxtdan TASHQARI commit TARIXI ham skanerlanadi: PR'da —
  # PR diapazoni (base..head), dev push'da — yangi commitlar (before..after).
  # Aks holda bir commitda qo'shilib keyingisida o'chirilgan sekret daraxtda
  # ko'rinmay o'tib ketardi. To'liq tarix — haftalik security-weekly.yml'da.
  # Ma'lum eski topilmalar `.gitleaksignore` da (aniq fingerprint'lar).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Diapazon skaneri uchun base/before commit'lari ham kerak.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -e
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for committed secrets
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1

      # PR → base..head; dev push → before..after; qo'lda ishga tushirish,
      # yangi branch yoki force-push (before tarixda yo'q) → to'liq tarix.
      - name: Scan commit history (PR range / pushed commits)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "$PUSH_BEFORE" ] \
            && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
          if [ -n "$RANGE" ]; then
            echo "gitleaks: commit range $RANGE"
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1 --log-opts="$RANGE"
          else
            echo "gitleaks: full history"
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
          fi

  coverage-summary:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx jest --coverage --coverageReporters=text-summary
        continue-on-error: true
