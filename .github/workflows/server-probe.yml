# BIR MARTALIK: deploy kaliti qaysi serverga / qaysi foydalanuvchi bilan
# kirishini qiymatni LOGGA CHIQARMASDAN aniqlash — har tekshiruv alohida job,
# natija faqat "o'tdi/yiqildi". Ish tugagach o'chiriladi.
name: Server probe (one-off)

on:
  push:
    branches: [dev, main]
    paths: ['.github/workflows/server-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - reach
          - ip-5.189.141.169
          - is-root
          - has-passwordless-sudo
          - user-deploy
          - user-ubuntu
          - user-elchi
          - user-admin
          - user-debian
          - user-dilshod
          - user-dilshodbek
          - user-github
          - user-ci
          - user-app
          - user-elchipochta
          - user-devops
    name: ${{ matrix.check }}
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            C='${{ matrix.check }}'
            case "$C" in
              reach) true ;;
              ip-*) [ "$(curl -s --max-time 10 https://api.ipify.org)" = "${C#ip-}" ] ;;
              is-root) [ "$(id -u)" = 0 ] ;;
              has-passwordless-sudo) sudo -n true 2>/dev/null ;;
              user-*) [ "$(whoami)" = "${C#user-}" ] ;;
            esac
