name: Elchi CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Critical-path specs (observability/idempotency sprint) MUST pass
      # before a production deploy. Legacy specs still drift, so the full
      # suite runs too but non-blocking — a known-flaky legacy spec must
      # not block production. Mirrors the gating in ci.yml.
      - name: Critical-path unit tests (must pass)
        run: |
          npx jest \
            apps/finance-service/src/finance-service.service.spec.ts \
            apps/identity-service/src/auth/auth.service.spec.ts \
            apps/order-service/src/order-service.bulk-batch.spec.ts \
            --runInBand
        env:
          NODE_ENV: test

      # Elchi Partner API (marketplace integration) — must pass before deploy.
      - name: Partner API tests (must pass)
        run: npx jest partner --runInBand
        env:
          NODE_ENV: test

      # BLOCKING before deploy: the full suite is green, so a money/RBAC/legacy
      # regression can no longer ship. (Audit testing P1.)
      - name: Full unit test suite (must pass)
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Build check
        run: |
          npx nest build api-gateway
          npx nest build logistics-service
          npx nest build order-service
          npx nest build integration-service

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 50m
          # NOT script_stop: drone-ssh's script_stop instruments the script
          # line-by-line and treats ANY `[ test ]` in an `if` that evaluates
          # false as a fatal error — so `if [ "$RUN_MIGRATIONS" != true ]` aborted
          # the whole deploy whenever a migration/libs change set RUN_MIGRATIONS=true
          # (every migration-bearing deploy died here). The script's own `set -e`
          # + `trap rollback ERR` give fail-fast + rollback with correct shell
          # control flow, so error handling is not lost.
          script_stop: false
          script: |
            set -ex
            cd ${{ secrets.SERVER_APP_PATH }}
            git config --global --add safe.directory ${{ secrets.SERVER_APP_PATH }} || true
            cp -f .env.production /tmp/elchi-env-backup 2>/dev/null || true

            OLD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin main
            NEW_SHA="$(git rev-parse origin/main)"

            APP_SERVICES="api-gateway identity-service order-service catalog-service logistics-service finance-service notification-service integration-service analytics-service branch-service investor-service file-service c2c-service search-service"
            DEPLOY_SERVICES=""
            DEPLOY_ALL=false
            RUN_MIGRATIONS=false

            if [ -z "$OLD_SHA" ]; then
              DEPLOY_ALL=true
            elif [ "$OLD_SHA" != "$NEW_SHA" ]; then
              git diff --name-only "$OLD_SHA" "$NEW_SHA" > /tmp/elchi-changed-files
              cat /tmp/elchi-changed-files

              if grep -Eq '^(libs/|package\.json$|package-lock\.json$|nest-cli\.json$|tsconfig.*\.json$|docker-compose\.prod\.yml$|\.github/workflows/deploy\.yml$)' /tmp/elchi-changed-files; then
                DEPLOY_ALL=true
              fi
              if grep -Eq '^(migrations/|scripts/init-schemas\.sql$)' /tmp/elchi-changed-files; then
                RUN_MIGRATIONS=true
              fi
              for service in $APP_SERVICES; do
                if grep -q "^apps/$service/" /tmp/elchi-changed-files; then
                  DEPLOY_SERVICES="$DEPLOY_SERVICES $service"
                fi
              done
            fi

            if [ "$DEPLOY_ALL" = true ]; then
              DEPLOY_SERVICES="$APP_SERVICES"
              RUN_MIGRATIONS=true
            fi

            # --- Rollback safety net -------------------------------------------
            # On ANY failure after this point (bad migration, failed build,
            # crashing container), revert the code to the previously-deployed
            # commit and rebuild the running services from it, so production is
            # never left half-deployed on new code. A failed migration may have
            # partially applied schema changes — the pre-migration dump written
            # to ./backups/pre-migration/ below is the DB restore point.
            rollback() {
              set +e
              echo "!!! DEPLOY FAILED — rolling back code to ${OLD_SHA:-unknown}"
              if [ -n "$OLD_SHA" ]; then
                git reset --hard "$OLD_SHA"
                docker compose -f docker-compose.prod.yml up -d --no-deps --build $APP_SERVICES
                echo "!!! Rolled back to $OLD_SHA. If migrations ran, restore the DB from the newest ./backups/pre-migration/*.sql.gz"
              fi
              docker compose -f docker-compose.prod.yml ps || true
            }
            trap 'rollback' ERR

            git checkout -f main
            git reset --hard origin/main
            test -f .env.production || cp -f /tmp/elchi-env-backup .env.production

            docker compose -f docker-compose.prod.yml pull rabbitmq postgres minio cloudflared || true
            docker compose -f docker-compose.prod.yml up -d --remove-orphans rabbitmq postgres minio

            if [ "$RUN_MIGRATIONS" != true ]; then
              echo "No migration changes detected."
            else
              # Pre-migration safety dump — a buggy/destructive migration must
              # always be recoverable to the exact pre-migration state. The
              # migration is GATED on a successful, non-empty backup.
              echo "Taking pre-migration DB backup (gates the migration)..."
              mkdir -p ./backups/pre-migration
              BK="./backups/pre-migration/pre-migration-$(date -u +%Y%m%d-%H%M%S).sql.gz"
              docker compose -f docker-compose.prod.yml exec -T postgres \
                sh -c 'pg_dump --no-owner --no-privileges --clean --if-exists -U "$POSTGRES_USER" "$POSTGRES_DB"' \
                | gzip -9 > "$BK"
              BK_SIZE="$(stat -c%s "$BK" 2>/dev/null || echo 0)"
              if [ "$BK_SIZE" -lt 1024 ]; then
                echo "Pre-migration backup is only ${BK_SIZE} bytes — treating as FAILED, aborting before migrating." >&2
                exit 1
              fi
              echo "Pre-migration backup ok (${BK_SIZE} bytes): $BK"

              docker compose -f docker-compose.prod.yml up --build --force-recreate --abort-on-container-exit migration-runner
              docker compose -f docker-compose.prod.yml rm -f migration-runner || true
            fi

            test -z "$DEPLOY_SERVICES" && echo "No application service changes detected; keeping running containers as-is." || { echo "Deploying services:$DEPLOY_SERVICES"; docker compose -f docker-compose.prod.yml up -d --no-deps --build --remove-orphans $DEPLOY_SERVICES; }

            docker compose -f docker-compose.prod.yml up -d --no-deps cloudflared || true
            docker compose -f docker-compose.prod.yml ps

            # Reclaim what this deploy just superseded: the previous service
            # images (now unreferenced) and stale build cache. Without it the
            # box filled to 156G/81% over five months. Rollback does not need
            # the old images — it rebuilds from OLD_SHA — so this is safe to run
            # here. Never fatal: a cleanup problem must not fail, or roll back,
            # a deploy that already succeeded.
            bash scripts/docker-gc.sh || true
