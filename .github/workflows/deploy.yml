name: Elchi CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Critical-path specs (observability/idempotency sprint) MUST pass
      # before a production deploy. Legacy specs still drift, so the full
      # suite runs too but non-blocking — a known-flaky legacy spec must
      # not block production. Mirrors the gating in ci.yml.
      - name: Critical-path unit tests (must pass)
        run: |
          npx jest \
            apps/finance-service/src/finance-service.service.spec.ts \
            apps/identity-service/src/auth/auth.service.spec.ts \
            apps/order-service/src/order-service.bulk-batch.spec.ts \
            --runInBand
        env:
          NODE_ENV: test

      # Elchi Partner API (marketplace integration) — must pass before deploy.
      - name: Partner API tests (must pass)
        run: npx jest partner --runInBand
        env:
          NODE_ENV: test

      # BLOCKING before deploy: the full suite is green, so a money/RBAC/legacy
      # regression can no longer ship. (Audit testing P1.)
      - name: Full unit test suite (must pass)
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Build check
        run: |
          npx nest build api-gateway
          npx nest build logistics-service
          npx nest build order-service
          npx nest build integration-service
          npx nest build ai-service

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 50m
          # NOT script_stop: drone-ssh's script_stop instruments the script
          # line-by-line and treats ANY `[ test ]` in an `if` that evaluates
          # false as a fatal error — so `if [ "$RUN_MIGRATIONS" != true ]` aborted
          # the whole deploy whenever a migration/libs change set RUN_MIGRATIONS=true
          # (every migration-bearing deploy died here). The script's own `set -e`
          # + `trap rollback ERR` give fail-fast + rollback with correct shell
          # control flow, so error handling is not lost.
          script_stop: false
          script: |
            set -ex
            cd ${{ secrets.SERVER_APP_PATH }}
            git config --global --add safe.directory ${{ secrets.SERVER_APP_PATH }} || true
            cp -f .env.production /tmp/elchi-env-backup 2>/dev/null || true

            OLD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin main
            NEW_SHA="$(git rev-parse origin/main)"

            APP_SERVICES="api-gateway identity-service order-service catalog-service logistics-service finance-service notification-service integration-service analytics-service branch-service investor-service file-service c2c-service search-service ai-service"
            DEPLOY_SERVICES=""
            DEPLOY_ALL=false
            RUN_MIGRATIONS=false
            BACKUP_SIDECAR_RECREATE=false

            if [ -z "$OLD_SHA" ]; then
              DEPLOY_ALL=true
            elif [ "$OLD_SHA" != "$NEW_SHA" ]; then
              git diff --name-only "$OLD_SHA" "$NEW_SHA" > /tmp/elchi-changed-files
              cat /tmp/elchi-changed-files

              if grep -Eq '^(libs/|package\.json$|package-lock\.json$|nest-cli\.json$|tsconfig.*\.json$|docker-compose\.prod\.yml$|\.github/workflows/deploy\.yml$)' /tmp/elchi-changed-files; then
                DEPLOY_ALL=true
              fi
              if grep -Eq '^(migrations/|scripts/init-schemas\.sql$)' /tmp/elchi-changed-files; then
                RUN_MIGRATIONS=true
              fi
              # db-backup runs its bind-mounted scripts from a long-lived bash
              # loop, so a script change only takes effect after a recreate.
              if grep -Eq '^scripts/backup-(cron|db)\.sh$' /tmp/elchi-changed-files; then
                BACKUP_SIDECAR_RECREATE=true
              fi
              for service in $APP_SERVICES; do
                if grep -q "^apps/$service/" /tmp/elchi-changed-files; then
                  DEPLOY_SERVICES="$DEPLOY_SERVICES $service"
                fi
              done
            fi

            if [ "$DEPLOY_ALL" = true ]; then
              DEPLOY_SERVICES="$APP_SERVICES"
              RUN_MIGRATIONS=true
            fi

            # --- Rollback safety net -------------------------------------------
            # On ANY failure after this point (bad migration, failed build,
            # crashing container), revert the code to the previously-deployed
            # commit and rebuild the running services from it, so production is
            # never left half-deployed on new code. A failed migration may have
            # partially applied schema changes — the pre-deploy dump written to
            # ./backups/pre-deploy/ below ($PRE_DEPLOY_BK) is the DB restore
            # point. The rollback never restores the DB by itself (that would
            # drop writes made since the dump) — docs/ops/db-backups.md.
            #
            # ⚠️ Only services that EXIST in the rolled-back compose file are
            # rebuilt. APP_SERVICES is the NEW list: on the first deploy of a new
            # service (e.g. ai-service) the old docker-compose.prod.yml restored
            # by `git reset --hard $OLD_SHA` has no such service, and a single
            # unknown name makes `docker compose up` abort ("no such service")
            # WITHOUT rebuilding any of the others — production would stay on the
            # half-deployed new code. A service left over from the failed deploy
            # keeps running untouched; nothing on the old code calls it.
            rollback() {
              set +e
              echo "!!! DEPLOY FAILED — rolling back code to ${OLD_SHA:-unknown}"
              if [ -n "$OLD_SHA" ]; then
                git reset --hard "$OLD_SHA"
                ROLLBACK_SERVICES=""
                for s in $APP_SERVICES; do
                  docker compose -f docker-compose.prod.yml config --services 2>/dev/null | grep -qx "$s" && ROLLBACK_SERVICES="$ROLLBACK_SERVICES $s"
                done
                # An empty list must never reach `up`: with no service names it
                # would start EVERY service in the file (migration-runner too).
                if [ -n "$ROLLBACK_SERVICES" ]; then
                  echo "!!! Rebuilding from $OLD_SHA:$ROLLBACK_SERVICES"
                  docker compose -f docker-compose.prod.yml up -d --no-deps --build $ROLLBACK_SERVICES
                else
                  echo "!!! Could not list services from the old compose file — no service was rebuilt; fix manually."
                fi
                if [ -n "${PRE_DEPLOY_BK:-}" ]; then
                  echo "!!! Rolled back to $OLD_SHA. If migrations ran, restore the DB from this deploy's pre-deploy dump: $PRE_DEPLOY_BK (runbook: docs/ops/db-backups.md)"
                else
                  echo "!!! Rolled back to $OLD_SHA. If migrations ran, restore the DB from the newest ./backups/pre-deploy/pre-deploy-*.sql.gz (runbook: docs/ops/db-backups.md)"
                fi
              fi
              docker compose -f docker-compose.prod.yml ps || true
              # The `set +e` above outlives the trap: without this exit the
              # script carried on with the remaining deploy steps on the
              # rolled-back code and ended 0 — a failed deploy showed green.
              exit 1
            }
            trap 'rollback' ERR

            git checkout -f main
            git reset --hard origin/main
            test -f .env.production || cp -f /tmp/elchi-env-backup .env.production

            # --- Pre-deploy DB backup (gate) -----------------------------------
            # Har bir deploydan oldin backup: EVERY deploy, after the new code is
            # checked out (so the new scripts run) but BEFORE any image is pulled,
            # any container is (re)built or any migration runs. Verified dump in
            # ./backups/pre-deploy/ (newest 5 kept, scripts/pre-deploy-backup.sh);
            # it is also this deploy's migration restore point — no second dump.
            # If it fails, nothing has been touched yet: reset the code back to
            # OLD_SHA (so the next run still sees the full diff), skip the
            # rollback rebuild, and stop. Old ./backups/pre-migration/ dumps are
            # left as they are (no longer written or rotated).
            PRE_DEPLOY_BK=""
            if ! PRE_DEPLOY_BK="$(bash scripts/pre-deploy-backup.sh "$OLD_SHA" "$NEW_SHA")"; then
              trap - ERR
              echo "!!! Pre-deploy DB backup FAILED — deploy aborted BEFORE touching any container (see the [pre-deploy]/[backup-db] lines above)." >&2
              if [ -n "$OLD_SHA" ]; then git reset --hard "$OLD_SHA"; fi
              echo "!!! Running containers are unchanged and the code is back on ${OLD_SHA:-the previous commit}. Fix the backup, then re-run the deploy." >&2
              exit 1
            fi
            echo "Pre-deploy backup: ${PRE_DEPLOY_BK:-skipped (first install, no database yet)}"

            docker compose -f docker-compose.prod.yml pull rabbitmq postgres minio cloudflared || true
            docker compose -f docker-compose.prod.yml up -d --remove-orphans rabbitmq postgres minio

            if [ "$RUN_MIGRATIONS" != true ]; then
              echo "No migration changes detected."
            else
              # A buggy/destructive migration must always be recoverable: the
              # migration only runs because the pre-deploy backup above passed
              # (pg_dump ok, gzip intact, "dump complete" trailer). That dump is
              # the restore point.
              echo "Migration restore point: ${PRE_DEPLOY_BK:-none (first install, no database yet)}"

              docker compose -f docker-compose.prod.yml up --build --force-recreate --abort-on-container-exit migration-runner
              docker compose -f docker-compose.prod.yml rm -f migration-runner || true
            fi

            test -z "$DEPLOY_SERVICES" && echo "No application service changes detected; keeping running containers as-is." || { echo "Deploying services:$DEPLOY_SERVICES"; docker compose -f docker-compose.prod.yml up -d --no-deps --build --remove-orphans $DEPLOY_SERVICES; }

            docker compose -f docker-compose.prod.yml up -d --no-deps cloudflared || true

            # --- Daily backup sidecar (db-backup) -------------------------------
            # Har kuni 05:00 (Asia/Tashkent) backup, ./backups/daily/, newest 7
            # kept. Started/updated on EVERY deploy — it was never started before,
            # so prod had no scheduled backup at all. `up -d` creates it when it
            # does not exist yet and is a no-op when nothing changed; a change to
            # its scripts forces a recreate. --no-deps: postgres is already up.
            # Then make sure it stays up (not crash-looping). A sidecar problem
            # must not roll back an app deploy that already succeeded, so it is
            # reported at the very end and turns the job red instead.
            DB_BACKUP_SIDECAR_OK=true
            if [ "$BACKUP_SIDECAR_RECREATE" = true ]; then
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate db-backup || DB_BACKUP_SIDECAR_OK=false
            else
              docker compose -f docker-compose.prod.yml up -d --no-deps db-backup || DB_BACKUP_SIDECAR_OK=false
            fi
            DB_BACKUP_CID="$(docker compose -f docker-compose.prod.yml ps -q db-backup 2>/dev/null || true)"
            DB_BACKUP_R1="$(docker inspect -f '{{.RestartCount}}' "$DB_BACKUP_CID" 2>/dev/null || echo none)"
            sleep 5
            DB_BACKUP_STATE="$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$DB_BACKUP_CID" 2>/dev/null || echo none)"
            [ -n "$DB_BACKUP_CID" ] && [ "$DB_BACKUP_STATE" = "running $DB_BACKUP_R1" ] || DB_BACKUP_SIDECAR_OK=false
            docker compose -f docker-compose.prod.yml logs --tail 20 db-backup || true

            docker compose -f docker-compose.prod.yml ps

            # Reclaim what this deploy just superseded: the previous service
            # images (now unreferenced) and stale build cache. Without it the
            # box filled to 156G/81% over five months. Rollback does not need
            # the old images — it rebuilds from OLD_SHA — so this is safe to run
            # here. Never fatal: a cleanup problem must not fail, or roll back,
            # a deploy that already succeeded.
            bash scripts/docker-gc.sh || true

            if [ "$DB_BACKUP_SIDECAR_OK" != true ]; then
              trap - ERR
              echo "!!! The deploy itself succeeded, but the db-backup sidecar is NOT running — daily backups are OFF." >&2
              echo "!!! Check: docker compose -f docker-compose.prod.yml logs db-backup   (state: ${DB_BACKUP_STATE:-unknown})" >&2
              exit 1
            fi
